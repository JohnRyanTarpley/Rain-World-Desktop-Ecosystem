# EditMode tests on every push and PR, then a Windows build artifact.
#
# The Unity jobs need a Unity license in repo secrets (see https://game.ci/docs/github/activation):
#   UNITY_LICENSE  - contents of the .ulf file
#   UNITY_EMAIL    - Unity account email
#   UNITY_PASSWORD - Unity account password
# Without them the Unity jobs are skipped with a warning, and only the project checks run.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/check-project.mjs

  unity-license:
    name: Unity license available?
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::UNITY_LICENSE secret is not set; skipping EditMode tests and the Windows build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  editmode-tests:
    name: EditMode tests
    needs: [project-checks, unity-license]
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            Library-test-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}-
            Library-test-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  windows-build:
    name: Windows build
    needs: editmode-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            Library-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}-
            Library-StandaloneWindows64-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: RainWorldDesktop
      - uses: actions/upload-artifact@v4
        with:
          name: RainWorldDesktop-Windows64-${{ github.sha }}
          path: build/StandaloneWindows64
          if-no-files-found: error
