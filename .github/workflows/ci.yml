# Tests on every push and PR, then a Windows build artifact. Needs no secrets or licences.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/check-project.mjs

  test:
    name: Build and test
    needs: project-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test RWDE.sln --configuration Release --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  windows-build:
    name: Windows build
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/RWDE.App/RWDE.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: rwde-win-x64-${{ github.sha }}
          path: publish
          if-no-files-found: error
